<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 -132 170 500" width="340" height="1000" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Front-back ambiguity</title>
  <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- head (same as head-top-view.svg) -->
    <ellipse cx="100" cy="115" rx="62" ry="72"/>
    <path d="M 91 43.8 Q 100 24 109 43.8"/>
    <path d="M 39.4 100 Q 26 105 27 117 Q 28 128 39.4 130"/>
    <path d="M 160.6 100 Q 174 105 173 117 Q 172 128 160.6 130"/>

    <!-- sources: B is A mirrored across the interaural axis (y = 117) -->
    <circle cx="85" cy="-93" r="8"/>
    <circle cx="85" cy="327" r="8"/>

  </g>

  <!-- paths from each source to each ear (dotted) -->
  <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.01 7">
    <line x1="82.87" y1="-85.29" x2="27" y2="117"/>
    <line x1="88.09" y1="-85.62" x2="173" y2="117"/>
    <line x1="82.87" y1="319.29" x2="27" y2="117"/>
    <line x1="88.09" y1="319.62" x2="173" y2="117"/>
  </g>

  <!-- equal-length tick marks: single = left ear, double = right ear -->
  <g stroke="#000" stroke-width="2.5" stroke-linecap="round">
    <line x1="49.25" y1="10.14" x2="62.75" y2="13.86"/>
    <line x1="121.19" y1="11.48" x2="134.11" y2="6.06"/>
    <line x1="123.89" y1="17.94" x2="136.81" y2="12.52"/>
    <line x1="49.25" y1="223.86" x2="62.75" y2="220.14"/>
    <line x1="121.19" y1="222.52" x2="134.11" y2="227.94"/>
    <line x1="123.89" y1="216.06" x2="136.81" y2="221.48"/>
  </g>

  <!-- point labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000">
    <text x="85" y="-110">A</text>
    <text x="85" y="358">B</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
