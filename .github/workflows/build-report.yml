name: Build report

on:
  push:
    branches: [main]
    paths:
      - "report/**"
      - ".github/workflows/build-report.yml"
  pull_request:
    paths:
      - "report/**"
      - ".github/workflows/build-report.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile proposal and final report
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report
          root_file: |
            main_proposal.tex
            main_final.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build

      # latexmk succeeds even when citations are missing, so check the logs.
      # Missing citations fail the proposal; the final report only warns until
      # its template text is replaced.
      - name: Check for undefined citations and references
        working-directory: report/build
        run: |
          status=0
          for doc in main_proposal main_final; do
            missing=$(grep -E "(Citation|Reference) .* undefined" "$doc.log" | sed -E "s/.*(Citation|Reference) \`([^']*)'.*/\2/" | sort -u)
            [ -z "$missing" ] && continue
            for key in $missing; do
              if [ "$doc" = main_proposal ]; then
                echo "::error file=report/$doc.tex::Undefined citation or reference: $key"
                status=1
              else
                echo "::warning file=report/$doc.tex::Undefined citation or reference: $key"
              fi
            done
          done
          exit $status

      # Upload each PDF on its own, unzipped (archive: false needs
      # upload-artifact v7 and takes a single file), so each one downloads
      # directly as a PDF and opens in the browser.
      - name: Upload proposal PDF
        id: upload-proposal
        if: always() && hashFiles('report/build/main_proposal.pdf') != ''
        uses: actions/upload-artifact@v7
        with:
          path: report/build/main_proposal.pdf
          archive: false

      - name: Upload final report PDF
        id: upload-final
        if: always() && hashFiles('report/build/main_final.pdf') != ''
        uses: actions/upload-artifact@v7
        with:
          path: report/build/main_final.pdf
          archive: false

      - name: Add download links to the run summary
        if: always()
        env:
          PROPOSAL_URL: ${{ steps.upload-proposal.outputs.artifact-url }}
          FINAL_URL: ${{ steps.upload-final.outputs.artifact-url }}
        run: |
          {
            echo "## Report PDFs"
            echo
            if [ -n "$PROPOSAL_URL" ]; then
              echo "- Proposal: [main_proposal.pdf]($PROPOSAL_URL)"
            else
              echo "- Proposal: not built"
            fi
            if [ -n "$FINAL_URL" ]; then
              echo "- Final report: [main_final.pdf]($FINAL_URL)"
            else
              echo "- Final report: not built"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
